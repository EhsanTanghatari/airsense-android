name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (protocol parser, AQI)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug + release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AirSense-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/AirSense-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: AirSense-apk
          path: out/*.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk --title "AirSense latest build" \
            --notes "Built from ${GITHUB_SHA}. Install AirSense-release.apk on your phone." --prerelease
